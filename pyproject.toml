[project]
name = "debcontrol"
version = "0.1.0"
description = "Web application for managing Debian machines over SSH"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    # Note: the `redis-py` client library is independent from the Redis SERVER
    # version (8.8) — it's pinned to the <6 line because `arq` (task queue)
    # currently only supports redis-py <6. See README.md, "Dependency version notes".
    "redis[hiredis]>=5.3.1,<6",
    "arq>=0.28.0",
    "asyncssh>=2.24.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.1",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
# S101: assert used (fine in tests).
# B008: Depends()/Form() as a parameter default is the idiomatic, required
# dependency-injection pattern in FastAPI, not a bug.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# "password" here is just an enum value label (authentication method), not a secret.
"app/db/models/machine.py" = ["S105"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Strict typing pays off mainly in `app/` — test fixtures and asserts don't
# need it, and annotating them just slows things down for no real benefit.
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
