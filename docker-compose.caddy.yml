# Kept so that older commands keep working:
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# still starts the bundled Caddy. Since 0.128.0 Caddy lives in
# docker-compose.yml under the `caddy` profile; the usual way is
# COMPOSE_PROFILES=postgres,caddy in .env and a plain `docker compose up -d`
# (scripts/upgrade.sh sets that up by itself). See wiki/Installation.

services:
  caddy:
    profiles: !reset []
