# Shared by every language in codeql.yml. Third-party bundles vendored under
# app/web/static/ (htmx, xterm.js, Swagger UI) aren't this project's code:
# their findings can't be fixed here and would drown out the real ones.
# They're updated from upstream releases instead (see the wiki: Development).
name: debcontrol CodeQL config
paths-ignore:
  - app/web/static/js/htmx.min.js
  - app/web/static/js/xterm.min.js
  - app/web/static/js/xterm-addon-*.min.js
  - app/web/static/js/swagger-ui-*.js
  # Autogenerated Alembic migrations — frozen history, never edited after
  # they ship, so a style finding there has nothing to act on.
  - alembic/versions
  # Jinja2 templates: the JavaScript extractor misreads `{{ ... }}`
  # expressions (`'%.0f' % x`, `items | length`) as JS and reports noise.
  # The strict CSP forbids inline scripts, so no real JS lives here anyway.
  - app/web/templates
query-filters:
  # Import cycles are broken on purpose with `if TYPE_CHECKING:` and
  # function-local imports; this query can't see that and flags every one.
  - exclude:
      id: py/unsafe-cyclic-import
  # Unused imports are already enforced by ruff (F401) in CI, which also
  # understands `TYPE_CHECKING` and re-exports — this query doesn't.
  - exclude:
      id: py/unused-import
