name: Fuzz

# Coverage-guided fuzzing of every target in fuzz/targets.py with Atheris
# (libFuzzer for Python): the parsers of machine output, network replies and
# user input — see fuzz/__init__.py.
#
# - On a PR that touches the code: `quick`, four jobs that split every
#   target between them and fuzz each for 30 seconds. Few jobs on purpose:
#   one job per target (28+) used to fill every free runner and queue the
#   rest of the PR's checks behind it for half an hour.
# - Weekly and by hand: `fuzz`, one job per target, 20 minutes each.
#
# No run on a push to main: main only takes branches that are up to date
# with it, so the PR run already fuzzed exactly that code. A crash fails
# the job and uploads the input that caused it (replay it with
# `python -m fuzz.run <target> <file>`). tests/test_fuzz_targets.py keeps
# the weekly matrix below in sync with fuzz.targets.TARGETS; `quick` reads
# TARGETS itself, so it can't miss one.

on:
  pull_request:
    paths: ["app/**", "fuzz/**", "uv.lock", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the fuzzing of the commit it replaces.
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies (with Atheris)
        env:
          UV_PYTHON: "3.14"
        run: uv sync --locked --group fuzz

      - name: Fuzz shard ${{ matrix.shard }} of 4
        env:
          UV_PYTHON: "3.14"
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p crashes
          targets="$(uv run python -c 'import os; from fuzz.targets import TARGETS; print(*sorted(TARGETS)[int(os.environ["SHARD"])::4])')"
          failed=""
          for target in $targets; do
            echo "::group::$target"
            if ! uv run python -m fuzz.run "$target" \
                -max_total_time=30 \
                -artifact_prefix="crashes/$target-" \
                -print_final_stats=1; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzzing found a crash in:$failed"
            exit 1
          fi

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-shard-${{ matrix.shard }}
          path: crashes/
          if-no-files-found: ignore

  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - facts
          - packages
          - services
          - monitoring
          - journal
          - directory_listing
          - image_updates
          - log_path
          - journal_filters
          - readiness
          - advisories
          - proxmox
          - dns_answer
          - conditions_yaml
          - redirect
          - webhook_redaction
          - email
          - networks
          - tls_target
          - tags
          - docker_inventory
          - docker_scan
          - docker_update
          - docker_files_listing
          - docker_prune_output
          - restic_output
          - compose_input
          - backup_import
    steps:
      # Pinned by commit SHA like every other action here (see ci.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      # Atheris has no Python 3.15 wheel yet, so fuzzing alone stays on
      # 3.14 (the app itself, its image and the CI gate run 3.15).
      # UV_PYTHON overrides .python-version for every uv call below.
      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies (with Atheris)
        env:
          UV_PYTHON: "3.14"
        run: uv sync --locked --group fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          UV_PYTHON: "3.14"
          # 20 minutes each, weekly and by hand.
          SECONDS_PER_TARGET: "1200"
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p crashes
          uv run python -m fuzz.run "$TARGET" \
            -max_total_time="$SECONDS_PER_TARGET" \
            -artifact_prefix=crashes/ \
            -print_final_stats=1

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore
