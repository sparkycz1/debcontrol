name: CodeQL

# Static security analysis (SQL injection, XSS, SSRF, path traversal,
# unsafe deserialization, ...) — a different class of check from the
# `security` job in ci.yml, which only scans *dependencies* (pip-audit)
# for known CVEs, not this app's own code. Results show up under the
# repo's Security -> Code scanning tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches a new query/rule CodeQL itself ships, against code that
    # hasn't changed — a plain push/PR trigger alone would never re-scan
    # unchanged code once merged.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Job-level permissions replace, not add to, the workflow-level ones
    # above — contents:read has to be repeated here alongside the
    # security-events:write this job actually needs (uploading its SARIF
    # results), or checkout itself would have no read access.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:python"
