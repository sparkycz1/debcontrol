name: debcontrol

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    # Stamps the built image with the commit it came from (app.core.version,
    # shown on the Settings page) — set GIT_COMMIT in the shell/`.env` before
    # building, e.g. `GIT_COMMIT=$(git rev-parse HEAD) docker compose build`;
    # scripts/upgrade.sh does this automatically. Defaults to "unknown".
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: debcontrol:local
  env_file:
    - .env
  restart: unless-stopped

services:
  db:
    # Pinned to an exact patch version on purpose — the floating "18" tag
    # would silently pull newer minor releases on a rebuild. Bump this
    # deliberately (and re-test) rather than letting it happen implicitly.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Not published to the host on purpose — the DB is only reachable from
    # the docker network. Uncomment for local psql access:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Same reasoning as the Postgres image above — pinned to an exact patch.
    image: redis:8.10.1
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-image
    ports:
      # Bound to loopback only, and plain HTTP — this app is meant to sit
      # behind a TLS-terminating reverse proxy (the bundled `caddy` service
      # from docker-compose.caddy.yml, or your own; see the wiki). Any
      # reverse proxy running on this host can reach it at 127.0.0.1:8000;
      # one running as its own container needs to join this compose
      # project's network instead.
      - "127.0.0.1:8000:8000"
    volumes:
      - ssh_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-image
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    volumes:
      - ssh_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
  redis_data:
  ssh_data:
