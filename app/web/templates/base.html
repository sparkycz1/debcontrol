<!doctype html>
<html lang="{{ request.state.locale.code }}" data-theme="{{ 'light' if request.cookies.get('theme') == 'light' else 'dark' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# htmx otherwise injects its own <style> for .htmx-indicator on load,
     which `style-src 'self'` blocks (a console error on every page).
     Request feedback is styled in style.css (`.htmx-request`) instead. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}debcontrol{% endblock %}</title>
  <link rel="icon" href="{{ favicon_href() or '/static/img/favicon.svg' }}">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% from "partials/_brand.html" import render as render_brand %}
  <a class="skip-link" href="#main-content">{{ t(request, "nav.skip_to_content") }}</a>
  <header class="site-header">
    <a class="brand" href="/dashboard">{{ render_brand('header') }}</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="{{ t(request, 'nav.toggle_navigation') }}">☰</label>
    {% set current_user = request.state.user %}
    {% set current_path = request.url.path %}
    {# Day-to-day pages first, in the order an operator moves through them
       (overview → machines → what runs against them → who gets told);
       account/instance administration folded into one "Administration"
       menu — a plain <details>, so it needs no JS under the strict CSP.
       Each entry is (href, key, permission or none, active prefix). #}
    {% set main_links = [
      ('/dashboard', 'nav.dashboard', none, '/dashboard'),
      ('/machines', 'nav.machines', 'machine.view', '/machines'),
      ('/security/updates', 'nav.security', 'machine.view', '/security'),
      ('/machine-groups', 'nav.machine_groups', 'group.view', '/machine-groups'),
      ('/checks', 'nav.checks', 'machine.view', '/checks'),
      ('/scheduling', 'nav.scheduling', 'scheduling.view', '/scheduling'),
      ('/notifications', 'nav.notifications', 'notification.view', '/notifications'),
      ('/ai', 'nav.ai', 'ai.access', '/ai'),
    ] %}
    {% set admin_links = [
      ('/users', 'nav.users', 'user.manage', '/users'),
      ('/roles', 'nav.roles', 'user.manage', '/roles'),
      ('/audit', 'nav.audit', 'audit.view', '/audit'),
      ('/settings', 'nav.settings', 'settings.view', '/settings'),
      ('/backup', 'nav.backup', ('machine.view', 'scheduling.view', 'user.manage', 'notification.view'), '/backup'),
      ('/api', 'nav.api_docs', none, '/api'),
    ] %}
    {% macro nav_link(href, key, prefix) %}
      {% set is_active = current_path == prefix or current_path.startswith(prefix ~ '/') %}
      <a href="{{ href }}" {% if is_active %}class="active" aria-current="page"{% endif %}>{{ t(request, key) }}</a>
    {% endmacro %}
    <nav>
      {# AI only once a model is enabled (request.state.ai_available) —
         before that the page could only say "configure it in Settings". #}
      {% for href, key, perm, prefix in main_links if (perm is none or current_user.has_permission(perm)) and (href != '/ai' or request.state.ai_available or current_path.startswith('/ai')) %}
        {{ nav_link(href, key, prefix) }}
      {% endfor %}
      {% set visible_admin = [] %}
      {# A link's permission may be a tuple: shown when any one is held. #}
      {% for link in admin_links if link[2] is none or (link[2] is string and current_user.has_permission(link[2])) or (link[2] is not string and link[2] | select('permitted_for', current_user) | list) %}
        {% set _ = visible_admin.append(link) %}
      {% endfor %}
      {% set ns = namespace(admin_active=false) %}
      {% for link in visible_admin %}
        {% if current_path == link[3] or current_path.startswith(link[3] ~ '/') %}{% set ns.admin_active = true %}{% endif %}
      {% endfor %}
      <details class="nav-menu">
        <summary {% if ns.admin_active %}class="active"{% endif %}>{{ t(request, "nav.administration") }}</summary>
        <div class="nav-menu-items">
          {% for href, key, perm, prefix in visible_admin %}
            {{ nav_link(href, key, prefix) }}
          {% endfor %}
        </div>
      </details>
    </nav>
    <div class="site-header-user">
      <form method="get" action="/search" class="site-search" role="search">
        <input type="search" name="q" maxlength="100" data-global-search
               placeholder="{{ t(request, 'search.placeholder') }}" aria-label="{{ t(request, 'search.title') }}"
               title="{{ t(request, 'search.shortcut_hint') }}">
      </form>
      {% set current_theme = 'light' if request.cookies.get('theme') == 'light' else 'dark' %}
      {% set next_theme_label = t(request, 'theme.dark' if current_theme == 'light' else 'theme.light') %}
      <form method="post" action="/theme" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <input type="hidden" name="next" value="{{ request.url.path }}">
        <input type="hidden" name="theme" value="{{ 'dark' if current_theme == 'light' else 'light' }}">
        <button type="submit" class="link-button theme-toggle"
                title="{{ t(request, 'nav.switch_theme', theme=next_theme_label) }}"
                aria-label="{{ t(request, 'nav.switch_theme', theme=next_theme_label) }}">
          {{ '☀️' if current_theme == 'light' else '🌙' }}
        </button>
      </form>
      {% set impersonator = request.state.impersonator %}
      <a href="/account" class="impersonation-tag">
        {{ current_user.display_name or current_user.username }}
        {% if impersonator %}
          <span class="impersonation-admin" title="{{ t(request, 'impersonation.banner_title', admin=(impersonator.display_name or impersonator.username)) }}">
            {{ t(request, "impersonation.acting_as", admin=(impersonator.display_name or impersonator.username)) }}
          </span>
        {% endif %}
      </a>
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <button type="submit" class="link-button">
          {{ t(request, "impersonation.stop") if impersonator else t(request, "nav.log_out") }}
        </button>
      </form>
    </div>
  </header>

  <main class="container {% block main_class %}{% endblock %}" id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% set _commit = git_commit() %}
  <footer class="site-footer">
    <p>{{ t(request, "footer.tagline") }}</p>
    <p class="site-footer-meta">
      <a href="https://github.com/sparkycz1" target="_blank" rel="noopener">Jakub Adámek</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/sparkycz1/debcontrol/releases" target="_blank" rel="noopener"
         title="{{ t(request, 'footer.commit', commit=(_commit[:12] if _commit else t(request, 'footer.commit_unknown'))) }}">v{{ app_version }}</a>
    </p>
  </footer>

  <script src="{{ static_url('js/htmx.min.js') }}" defer></script>
  <script src="{{ static_url('js/confirm.js') }}" defer></script>
  <script src="{{ static_url('js/global-search.js') }}" defer></script>
  <script src="{{ static_url('js/bulk-select.js') }}" defer></script>
  <script src="{{ static_url('js/model-picker.js') }}" defer></script>
  <script src="{{ static_url('js/auto-submit.js') }}" defer></script>
  <script src="{{ static_url('js/smtp-encryption.js') }}" defer></script>
  <script src="{{ static_url('js/checklist-filter.js') }}" defer></script>
  <script src="{{ static_url('js/notification-conditions.js') }}" defer></script>
  <script src="{{ static_url('js/notification-delivery.js') }}" defer></script>
  <script src="{{ static_url('js/ai-auto-confirm.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
