<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}debcontrol{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/machines">debcontrol</a>
    <nav>
      <a href="/machines">Machines</a>
      <a href="/machine-groups">Machine groups</a>
      <a href="/users">Users</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}

  <footer class="site-footer">
    <p>debcontrol — manage Debian machines over SSH</p>
  </footer>

  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/confirm.js" defer></script>
</body>
</html>
