<!doctype html>
<html lang="{{ request.state.locale.code }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t(request, "disks.report_title") }} — {{ disk.model }} {{ disk.serial }}</title>
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <script src="{{ static_url('js/print-page.js') }}" defer></script>
</head>
<body class="disk-report">
  <main class="container">
    <div class="page-header">
      <h1>{{ t(request, "disks.report_title") }}: {{ disk.model }} <code>{{ disk.serial }}</code></h1>
      <button type="button" class="button no-print" data-print>{{ t(request, "disks.print") }}</button>
    </div>
    <p class="hint">{{ t(request, "disks.report_generated", when=(now | local_time('%Y-%m-%d %H:%M %Z'))) }}</p>
    {% set report = true %}
    {% include "disks/_body.html" %}
  </main>
</body>
</html>
