<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — debcontrol</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-page">
    <span class="brand">debcontrol</span>
    <div class="panel">
      {% if oidc_error %}
        <div class="alert alert-error"><p>{{ oidc_error }}</p></div>
      {% endif %}
      {% if error %}
        <div class="alert alert-error"><p>{{ error }}</p></div>
      {% endif %}

      <form method="post" action="/login" class="form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form.username or '' }}"
               autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="button">Log in</button>
      </form>

      {% if app_settings.oidc_enabled %}
        <a href="/auth/oidc/login" class="button button-secondary stack-gap">Log in with OIDC</a>
      {% endif %}
    </div>
  </main>
</body>
</html>
