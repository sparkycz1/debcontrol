<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-factor authentication — debcontrol</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-page">
    <span class="brand">debcontrol</span>
    <div class="panel">
      <h2>Enter your code</h2>
      <p class="hint">
        Enter the 6-digit code from your authenticator app, or one of your
        recovery codes if you've lost access to it.
      </p>

      {% if error %}
        <div class="alert alert-error"><p>{{ error }}</p></div>
      {% endif %}

      <form method="post" action="/login/totp" class="form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="code">Code</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required>
        <button type="submit" class="button">Verify</button>
      </form>
    </div>
  </main>
</body>
</html>
