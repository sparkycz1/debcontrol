{% if error %}
  <div class="alert alert-error">
    <p>Test failed: {{ error }}</p>
  </div>
{% elif result and result.ok %}
  <div class="alert alert-ok">
    <p>Connection works. Output of <code>uname -a</code>:</p>
    <pre>{{ result.output }}</pre>
  </div>
{% else %}
  <div class="alert alert-error">
    <p>Test failed: {{ result.error if result else 'unknown error' }}</p>
  </div>
{% endif %}
