{% extends "base.html" %}

{% block title %}Přidat stroj — debcontrol{% endblock %}

{% block content %}
  <h1>Přidat stroj</h1>

  {% if errors %}
    <div class="alert alert-error">
      {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}

  <form method="post" action="/machines" class="form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="hostname">Hostname / IP adresa</label>
    <input type="text" id="hostname" name="hostname" required maxlength="255"
           value="{{ form.hostname or '' }}">

    <label for="port">SSH port</label>
    <input type="number" id="port" name="port" min="1" max="65535"
           value="{{ form.port or 22 }}">

    <label for="username">Uživatelské jméno</label>
    <input type="text" id="username" name="username" required maxlength="255"
           value="{{ form.username or '' }}">

    <label for="auth_method">Způsob autentizace</label>
    <select id="auth_method" name="auth_method">
      {% for method in auth_methods %}
        <option value="{{ method.value }}" {% if form.auth_method == method %}selected{% endif %}>
          {{ 'Heslo' if method.value == 'password' else 'Privátní SSH klíč' }}
        </option>
      {% endfor %}
    </select>

    <label for="secret">Heslo / privátní klíč</label>
    <textarea id="secret" name="secret" rows="4"
      placeholder="Uloží se zašifrovaně. Nech prázdné, pokud ho doplníš později."></textarea>

    <label for="description">Poznámka</label>
    <textarea id="description" name="description" rows="2">{{ form.description or '' }}</textarea>

    <button type="submit" class="button">Uložit</button>
    <a class="button button-secondary" href="/machines">Zrušit</a>
  </form>
{% endblock %}
