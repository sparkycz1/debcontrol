{% extends "base.html" %}

{% block title %}Add role — debcontrol{% endblock %}

{% block content %}
  <h1>Add role</h1>

  {% if errors %}
    <div class="alert alert-error">
      {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}

  <form method="post" action="/roles" class="form" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required maxlength="100" value="{{ form.name or '' }}">

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="2">{{ form.description or '' }}</textarea>

    <label>Permissions</label>
    <div class="permission-grid">
      {% for permission in all_permissions %}
        <label>
          <input type="checkbox" name="permissions" value="{{ permission.value }}"
                 {{ 'checked' if permission.value in form.permissions else '' }}>
          {{ permission.value }}
        </label>
      {% endfor %}
    </div>

    <button type="submit" class="button">Save</button>
    <a class="button button-secondary" href="/roles">Cancel</a>
  </form>
{% endblock %}
