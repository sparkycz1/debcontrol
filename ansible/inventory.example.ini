; Copy to inventory.ini (gitignored-by-convention — don't commit real
; hostnames/IPs of machines you don't control) and fill in your machines.
; See the wiki page "Ansible Onboarding" for the full walkthrough.

[debcontrol_machines]
web1.example.com
192.0.2.10 ansible_host=192.0.2.10

; Ansible needs a way in *before* this playbook runs (it's what installs
; debcontrol's own key) — typically your own SSH key or, for a brand new
; cloud image, its default user:
; [debcontrol_machines:vars]
; ansible_user=admin
